name: Retrieval regression test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --all-groups

      - name: Indizes für beide Modellversionen bauen
        run: uv run python -m rag_migration.build_indexes

      - name: Retrieval-Regressionen prüfen
        run: uv run pytest -q