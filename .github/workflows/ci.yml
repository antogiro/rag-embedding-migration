name: RAG Retrieval Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  retrieval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluate Baseline and Candidate Indices
        run: python -m src.evaluation

      - name: Run CI Retrieval Quality Gates
        run: pytest -v
